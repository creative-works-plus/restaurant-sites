const ITER = 300000;
const KEY  = "cwp-memo-key";      // 一度計算した鍵を覚えておく場所（合言葉そのものは保存しない）
const $ = id => document.getElementById(id);

const b64  = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex  = a => [...a].map(v => v.toString(16).padStart(2, "0")).join("");
const unhex= s => new Uint8Array(s.match(/../g).map(h => parseInt(h, 16)));
const eq   = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

const raw   = b64(BLOB);
const salt  = raw.slice(0, 16), nonce = raw.slice(16, 24);
const tag   = raw.slice(24, 56), ct    = raw.slice(56);

async function derive(pass) {
  const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits(
      {name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256"}, base, 512));
}

async function open_(bits) {
  const encK = bits.slice(0, 32), macK = bits.slice(32);

  // 封印の確認（鍵が違えばここで落ちる）
  const hk   = await crypto.subtle.importKey(
      "raw", macK, {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  const body = new Uint8Array(salt.length + nonce.length + ct.length);
  body.set(salt); body.set(nonce, salt.length); body.set(ct, salt.length + nonce.length);
  if (!eq(tag, new Uint8Array(await crypto.subtle.sign("HMAC", hk, body)))) return false;

  const counter = new Uint8Array(16); counter.set(nonce);
  const ck = await crypto.subtle.importKey("raw", encK, "AES-CTR", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt(
      {name: "AES-CTR", counter, length: 64}, ck, ct);
  localStorage.setItem(KEY, hex(bits));
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
  return true;   // ここから先はページが差し替わっているので何も触らない
}

async function run(quiet) {
  const saved = localStorage.getItem(KEY);
  if (quiet && !saved) return;
  const pass = quiet ? null : $("pw").value.trim();
  if (!quiet && !pass) return;

  if (!quiet) {
    $("go").disabled = true;
    $("msg").style.color = "#9aa2b1"; $("msg").textContent = "開いています…";
  }
  try {
    const bits = quiet ? unhex(saved) : await derive(pass);
    if (await open_(bits)) return;                    // 成功＝ページが入れ替わる
    if (quiet) { localStorage.removeItem(KEY); $("pw").focus(); }
    else { $("msg").style.color = "#ff6b6b"; $("msg").textContent = "合言葉が違います"; }
  } catch (e) {
    if (!quiet) { $("msg").style.color = "#ff6b6b"; $("msg").textContent = "開けませんでした"; }
  }
  if ($("go")) $("go").disabled = false;
}

$("go").addEventListener("click", () => run(false));
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") run(false); });
if (localStorage.getItem(KEY)) run(true); else $("pw").focus();
</script>
